<fieldset class="chip-select fieldset">
  @if (label()) {
    <legend class="fieldset__legend">{{ label() }}</legend>
  }

  @if (options().length) {
    <div class="chip-select__list">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="chip-select__chip"
          [class.chip-select__chip--on]="isOn(option.value)"
          [attr.aria-pressed]="isOn(option.value)"
          (click)="toggled.emit(option.value)"
        >
          @if (option.swatch) {
            <span class="chip-select__swatch" [style.background]="option.swatch"></span>
          }
          {{ option.label }}
        </button>
      }
    </div>
  } @else if (emptyText()) {
    <p class="chip-select__empty">{{ emptyText() }}</p>
  }
</fieldset>
