<!--
  Both call sites check first, but the component is the one that knows a single
  page has nothing to page through — arrows to nowhere either side of a lone "1".
-->
@if (pages() > 1) {
  <nav aria-label="Pagination">
    <button
      type="button"
      (click)="go(page() - 1)"
      [disabled]="page() === 1"
      [attr.aria-label]="'pagination.prev' | t"
    >
      <app-icon [name]="'arrow-left'" [size]="24" />
    </button>
    @for (p of pageList(); track p) {
      <button
        type="button"
        class="num"
        [class.is-active]="p === page()"
        (click)="go(p)"
        [attr.aria-current]="p === page() ? 'page' : null"
      >
        {{ p }}
      </button>
    }
    <button
      type="button"
      (click)="go(page() + 1)"
      [disabled]="page() === pages()"
      [attr.aria-label]="'pagination.next' | t"
    >
      <app-icon [name]="'arrow-right'" [size]="24" />
    </button>
  </nav>
}
