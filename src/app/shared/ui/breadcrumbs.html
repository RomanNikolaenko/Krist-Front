<!--
  Callers build the trail from whatever the page knows about itself, which on a
  slow or failed load is nothing. An empty <nav> is still a flex row with a gap.
-->
@if (items().length) {
  <nav aria-label="Breadcrumb">
    @for (crumb of items(); track crumb.label; let last = $last) {
      @if (crumb.link && !last) {
        <a [routerLink]="crumb.link" [queryParams]="crumb.queryParams">{{ crumb.label }}</a>
      } @else {
        <span class="current">{{ crumb.label }}</span>
      }
      @if (!last) {
        <span class="sep"><app-icon [name]="'chevron-right'" [size]="20" /></span>
      }
    }
  </nav>
}
