<form [formGroup]="form" (ngSubmit)="submit()">
  <label class="field">
    <span class="field__label">{{ 'form.name' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="name"
      [placeholder]="'form.namePlaceholder' | t"
      [class.is-invalid]="invalid('name')"
    />
    @if (invalid('name')) {
      <span class="field__error">{{ 'form.nameRequired' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.mobile' | t }}</span>
    <input
      class="control"
      type="tel"
      formControlName="phone"
      [placeholder]="'form.mobilePlaceholder' | t"
      [class.is-invalid]="invalid('phone')"
    />
    @if (invalid('phone')) {
      <span class="field__error">{{ 'form.mobileInvalid' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.flat' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="line1"
      [class.is-invalid]="invalid('line1')"
    />
    @if (invalid('line1')) {
      <span class="field__error">{{ 'form.required' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.area' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="area"
      [class.is-invalid]="invalid('area')"
    />
    @if (invalid('area')) {
      <span class="field__error">{{ 'form.required' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.city' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="city"
      autocomplete="address-level2"
      [placeholder]="'form.cityPlaceholder' | t"
      [class.is-invalid]="invalid('city')"
    />
    @if (invalid('city')) {
      <span class="field__error">{{ 'form.cityRequired' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.pin' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="pin"
      [placeholder]="'form.pinPlaceholder' | t"
      [class.is-invalid]="invalid('pin')"
    />
    @if (invalid('pin')) {
      <span class="field__error">{{ 'form.pinInvalid' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'form.state' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="state"
      autocomplete="address-level1"
      [placeholder]="'form.statePlaceholder' | t"
      [class.is-invalid]="invalid('state')"
    />
    @if (invalid('state')) {
      <span class="field__error">{{ 'form.stateRequired' | t }}</span>
    }
  </label>

  <label class="check">
    <input type="checkbox" formControlName="isDefault" />
    <span>{{ 'form.default' | t }}</span>
  </label>

  <div class="actions">
    @if (showCancel()) {
      <button type="button" class="btn btn--ghost" (click)="cancelled.emit()">
        {{ 'form.cancel' | t }}
      </button>
    }
    <button type="submit" class="btn btn--primary">{{ submitLabel() | t }}</button>
  </div>
</form>
