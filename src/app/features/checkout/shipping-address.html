<div class="container page">
  <h1 class="page__title">{{ 'ship.title' | t }}</h1>

  <div class="layout">
    <div>
      <app-checkout-steps current="address" />

      <!--
        Two ways to answer one question. The saved ones are a shortcut for
        people who have some — a guest, or somebody who has never saved an
        address, sees only the form and is not told about a list they cannot
        have.
      -->
      @if (canPickSaved()) {
        <h2>{{ 'ship.selectAddress' | t }}</h2>
        <p class="lead">{{ 'ship.lead' | t }}</p>

        <div class="cards">
          @for (address of account.addresses(); track address.id) {
            <div class="card" [class.is-on]="picked() === address.id">
              <div class="card__head">
                <label class="check check--radio card__pick">
                  <input
                    type="radio"
                    name="ship-to"
                    [checked]="picked() === address.id"
                    (change)="picked.set(address.id)"
                    [attr.aria-label]="'ship.deliverTo' | t: { name: address.name }"
                  />
                  <span class="card__name">{{ address.name }}</span>
                </label>
              </div>

              <p class="card__lines">{{ line(address) }}</p>
            </div>
          }
        </div>

        <button type="button" class="btn btn--primary deliver" (click)="deliverHere()">
          {{ 'ship.deliverHere' | t }}
        </button>

        <hr />
      }

      <div class="form-wrap">
        <h2>{{ (canPickSaved() ? 'ship.addNew' : 'ship.enterAddress') | t }}</h2>
        <!--
          Submitting is the answer, not a detour: it takes the order to the next
          step. Signed in, the address is kept in the account on the way past.
        -->
        <app-address-form [submitLabel]="'ship.deliverHere'" (saved)="useNew($event)" />
      </div>
    </div>

    <app-order-summary />
  </div>
</div>
