<div class="container page">
  <h1 class="page__title">{{ 'blog.title' | t }}</h1>
  <p class="lead">{{ 'blog.lead' | t }}</p>

  <div class="grid">
    @for (post of posts; track post.slug) {
      <article class="post">
        <!--
          Not a link. These are teasers with no article behind them yet; a card
          that navigates nowhere is a worse promise than a card that does not
          claim to.
        -->
        <div class="post__media">
          <img [src]="post.image" alt="" width="351" height="234" loading="lazy" />
        </div>

        <p class="post__meta">
          <span class="post__tag">{{ post.tag }}</span>
          <span>{{ post.date }}</span>
          <span>&middot;</span>
          <span>{{ 'blog.minRead' | t: { count: post.minutes } }}</span>
        </p>

        <h2 class="post__title">{{ post.title }}</h2>
        <p class="post__excerpt">{{ post.excerpt }}</p>

        <p class="post__more">
          {{ 'blog.readMore' | t }}
          <app-icon [name]="'arrow-right'" [size]="24" />
        </p>
      </article>
    }
  </div>

  <app-feature-strip />
</div>
