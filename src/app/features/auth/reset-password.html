<app-auth-layout image="https://picsum.photos/seed/krist-reset/900/1200">
  <h1 class="auth-title">{{ 'auth.resetTitle' | t }}</h1>

  @if (token) {
    <p class="auth-sub">{{ 'auth.resetText' | t }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">{{ 'auth.newPassword' | t }}</span>
        <input
          class="control"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [class.is-invalid]="invalid('password')"
        />
        @if (invalid('password')) {
          <span class="field__error">{{ 'auth.passwordShort' | t }}</span>
        }
      </label>

      <label class="field">
        <span class="field__label">{{ 'auth.confirmPassword' | t }}</span>
        <input
          class="control"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
          [class.is-invalid]="mismatched()"
        />
        @if (mismatched()) {
          <span class="field__error">{{ 'auth.passwordsDiffer' | t }}</span>
        }
      </label>

      @if (error()) {
        <p class="alert alert--danger">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="submitting()">
        {{ (submitting() ? 'auth.saving' : 'auth.setPassword') | t }}
      </button>
    </form>
  } @else {
    <!-- Opened by hand rather than from the email; there is nothing to prove. -->
    <p class="auth-sub">{{ 'auth.resetNoToken' | t }}</p>
    <a class="btn btn--primary auth-submit" routerLink="/forgot-password">
      {{ 'auth.requestNewLink' | t }}
    </a>
  }
</app-auth-layout>
