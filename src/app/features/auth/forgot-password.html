<app-auth-layout image="https://picsum.photos/seed/krist-forgot/900/1200">
  <button type="button" class="auth-back" (click)="back()">
    <app-icon [name]="'chevron-left'" [size]="24" />
    {{ 'auth.back' | t }}
  </button>

  @if (sent()) {
    <h1 class="auth-title">{{ 'auth.linkSentTitle' | t }}</h1>
    <p class="auth-sub">{{ 'auth.linkSentText' | t: { email: form.controls.email.value } }}</p>

    <a class="btn btn--primary auth-submit" routerLink="/login">{{ 'auth.backToLogin' | t }}</a>
  } @else {
    <h1 class="auth-title">{{ 'auth.forgotTitle' | t }}</h1>
    <p class="auth-sub">{{ 'auth.forgotText' | t }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">{{ 'auth.email' | t }}</span>
        <input
          class="control"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.is-invalid]="invalid()"
        />
        @if (invalid()) {
          <span class="field__error">{{ 'auth.emailInvalid' | t }}</span>
        }
      </label>

      @if (error()) {
        <p class="alert alert--danger">{{ error() }}</p>
      }

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="submitting()">
        {{ (submitting() ? 'auth.sending' : 'auth.sendResetLink') | t }}
      </button>
    </form>
  }
</app-auth-layout>
