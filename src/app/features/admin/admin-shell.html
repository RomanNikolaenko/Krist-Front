<div class="admin" [class.admin--drawer]="drawerOpen()">
  <!--
    The bar only exists below the width where the rail fits beside the content.
    It is what opens the rail, and it carries the brand so the panel is not the
    only thing that says where you are.
  -->
  <header class="admin__bar">
    <button
      type="button"
      class="admin__burger"
      (click)="drawerOpen.set(!drawerOpen())"
      [attr.aria-expanded]="drawerOpen()"
      aria-controls="admin-side"
      [attr.aria-label]="'admin.sections' | t"
    >
      <app-icon [name]="drawerOpen() ? 'close' : 'menu'" [size]="24" />
    </button>

    <a class="admin__brand admin__brand--bar" routerLink="/">
      <strong>Krist</strong>
      <small>{{ 'admin.title' | t }}</small>
    </a>
  </header>

  <!-- Only reachable while the drawer is open; inert keeps it out of the tab order. -->
  <div
    class="admin__backdrop"
    [class.admin__backdrop--open]="drawerOpen()"
    (click)="drawerOpen.set(false)"
    aria-hidden="true"
  ></div>

  <aside
    class="admin__side"
    id="admin-side"
    [class.admin__side--open]="drawerOpen()"
    [attr.inert]="inert() ? '' : null"
  >
    <div class="admin__side-head">
      <a class="admin__brand" routerLink="/" (click)="drawerOpen.set(false)">
        <strong>Krist</strong>
        <small>{{ 'admin.title' | t }}</small>
      </a>

      <!-- The drawer covers the burger that opened it, so it carries its own way out. -->
      <button
        type="button"
        class="admin__close"
        (click)="drawerOpen.set(false)"
        [attr.aria-label]="'admin.closeSections' | t"
      >
        <app-icon [name]="'close'" [size]="24" />
      </button>
    </div>

    <nav class="admin__nav" [attr.aria-label]="'admin.sections' | t">
      @for (item of nav; track item.path) {
        <a
          class="admin__nav-item"
          [routerLink]="item.path"
          routerLinkActive="admin__nav-item--active"
          (click)="drawerOpen.set(false)"
        >
          <app-icon [name]="item.icon" [size]="20" />
          <span>{{ item.labelKey | t }}</span>
        </a>
      }
    </nav>

    <div class="admin__foot">
      <!-- The way back to the shop itself, which is easy to lose in here. -->
      <a class="admin__nav-item" routerLink="/" (click)="drawerOpen.set(false)">
        <app-icon [name]="'arrow-left'" [size]="20" />
        <span>{{ 'admin.backToShop' | t }}</span>
      </a>

      <button type="button" class="admin__nav-item" (click)="signOut()">
        <app-icon [name]="'logout'" [size]="20" />
        <span>{{ 'profile.signOut' | t }}</span>
      </button>

      <p class="admin__who">{{ account.fullName() }}</p>
    </div>
  </aside>

  <main class="admin__content"><router-outlet /></main>
</div>
