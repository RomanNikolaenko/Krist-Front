<div class="head">
  <div class="avatar">
    @if (account.profile().avatar; as photo) {
      <img [src]="photo" [alt]="account.fullName()" width="100" height="100" />
    } @else {
      <!-- no photo on the account: a glyph rather than a stock face, which
           would be one more thing on screen that is not the user's -->
      <span class="avatar__blank"><app-icon [name]="'avatar-placeholder'" [size]="52" /></span>
    }
    <!--
      A label rather than a button: it is the file input's own control, so it
      opens the picker without a click handler and stays reachable by keyboard.
    -->
    <label class="avatar__edit" [attr.aria-label]="'personal.changePhoto' | t">
      <app-icon [name]="uploading() ? 'check' : 'edit'" [size]="24" />
      <input
        type="file"
        accept="image/png,image/jpeg,image/webp"
        [disabled]="uploading()"
        (change)="onPhoto($event)"
      />
    </label>
  </div>

  @if (photoError()) {
    <p class="photo-error">{{ photoError() }}</p>
  } @else if (account.profile().avatar) {
    <button type="button" class="photo-remove" (click)="removePhoto()">
      {{ 'personal.removePhoto' | t }}
    </button>
  }

  <button type="button" class="btn btn--primary" (click)="toggleEdit()">
    <app-icon [name]="'edit'" [size]="24" />
    {{ (editing() ? 'personal.saveProfile' : 'personal.editProfile') | t }}
  </button>
</div>

<form [formGroup]="form">
  <label class="field">
    <span class="field__label">{{ 'personal.firstName' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="firstName"
      [class.is-invalid]="invalid('firstName')"
    />
    @if (invalid('firstName')) {
      <span class="field__error">{{ 'personal.firstNameRequired' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'personal.lastName' | t }}</span>
    <input
      class="control"
      type="text"
      formControlName="lastName"
      [class.is-invalid]="invalid('lastName')"
    />
    @if (invalid('lastName')) {
      <span class="field__error">{{ 'personal.lastNameRequired' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'personal.phone' | t }}</span>
    <input
      class="control"
      type="tel"
      formControlName="phone"
      [class.is-invalid]="invalid('phone')"
    />
    @if (invalid('phone')) {
      <span class="field__error">{{ 'personal.phoneInvalid' | t }}</span>
    }
  </label>

  <label class="field">
    <span class="field__label">{{ 'personal.email' | t }}</span>
    <input
      class="control"
      type="email"
      formControlName="email"
      [class.is-invalid]="invalid('email')"
    />
    @if (invalid('email')) {
      <span class="field__error">{{ 'personal.emailInvalid' | t }}</span>
    }
  </label>

  <label class="field full">
    <span class="field__label">{{ 'personal.address' | t }}</span>
    <input class="control" type="text" formControlName="address" />
  </label>

  @if (savedAt()) {
    <p class="saved full">{{ 'personal.updated' | t }}</p>
  }
</form>
