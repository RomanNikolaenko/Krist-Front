@if (account.unreadCount(); as unread) {
  <div class="head">
    <p class="unread">{{ unread }}</p>
    <button type="button" class="mark-all" (click)="markAllRead()">
      {{ 'notif.markAllRead' | t }}
    </button>
  </div>
}

@for (item of account.notifications(); track item.id) {
  <!-- A button rather than a clickable row: marking one read has to be
       reachable from the keyboard like everything else. -->
  <button type="button" class="item" [class.is-unread]="!item.read" (click)="markRead(item.id)">
    <span class="badge"><app-icon [name]="icon(item.kind)" [size]="24" /></span>

    <div>
      <p class="title">{{ title(item.kind) | t }}</p>
      <!-- The order number and product name the server sent with the event. -->
      <p class="text">
        {{ text(item.kind) | t }}
        @if (item.metadata['number']) {
          <span class="ref">{{ item.metadata['number'] }}</span>
        }
        @if (item.metadata['product']) {
          <span class="ref">{{ item.metadata['product'] }}</span>
        }
      </p>
    </div>

    <span class="time">{{ item.createdAt | d: 'd MMM, HH:mm' }}</span>
  </button>
}

@if (!account.notifications().length) {
  <div class="empty">
    <h3>{{ 'notif.noneTitle' | t }}</h3>
  </div>
}
